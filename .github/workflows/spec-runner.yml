name: spec-runner

on:
  pull_request:
    paths:
      - "spec-runner/**"
      - "implement-needs/SKILL.md"
      - "implement-needs/references/legacy-controller.md"
      - "implement-needs/scripts/spec_runner_handoff.py"
      - "implement-needs/tests/test_spec_runner_handoff.py"
      - ".github/workflows/spec-runner.yml"
  push:
    branches:
      - master
    paths:
      - "spec-runner/**"
      - "implement-needs/SKILL.md"
      - "implement-needs/references/legacy-controller.md"
      - "implement-needs/scripts/spec_runner_handoff.py"
      - "implement-needs/tests/test_spec_runner_handoff.py"
      - ".github/workflows/spec-runner.yml"

jobs:
  contract:
    name: contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade build pytest
      - name: Run Runner tests
        run: python -m unittest discover -s spec-runner/tests -q
      - name: Run thin-entry tests
        run: python -m unittest discover -s implement-needs/tests -p test_spec_runner_handoff.py -q
      - name: Build wheel
        working-directory: spec-runner
        run: python -m build --wheel --outdir dist-ci
      - name: Install the built wheel without source path
        shell: python
        run: |
          import glob
          import subprocess
          import sys
          wheel = glob.glob("spec-runner/dist-ci/*.whl")[0]
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", wheel], check=True)
      - name: Verify installed public CLI
        run: |
          spec-runner --version
          python -m spec_runner.cli fault run --seed ci-public-cli
